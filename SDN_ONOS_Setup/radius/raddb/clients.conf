client localhost {
	#  If both A and AAAA records are found, A records will be
	#  used in preference to AAAA.
	ipaddr = localhost
	proto = *
	secret = testing123
	nas_type	 = other	# localhost isn't usually a NAS...

	limit {
		max_connections = 16
		lifetime = 0
		idle_timeout = 30
	}
}

client red_gestion_sdn {
    ipaddr = sdn
    secret = testing123
}
# IPv6 Client
client localhost_ipv6 {
	ipv6addr	= ::1
	secret		= testing123
}

