services:
  r2_mab_vm:
    build: .
    container_name: r2-mab-vm
    restart: unless-stopped
    environment:
      R1_URL: http://policy_mapper:5000
      ONOS_URL: http://onos:8181
      VM_ACCESS_PORTS: of:00001a749039894a/2
      VM_MAX_CHILDREN: "2"
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - r2_state:/state
    networks:
      - sdn
    logging:
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  r2_state:

networks:
  sdn:
    external: true
    name: sdn
