services:
  onos:
    image: onosproject/onos:2.7.0
    environment:
      ONOS_APPS: gui2,drivers,openflow
      JAVA_OPTS: "-Xms256m -Xmx768m"
      MAB_MAPPER_URL: "http://policy_mapper:5000/api/mab-request"
    mem_limit: 1100m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
