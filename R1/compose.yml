services:
  # controlador
  onos:
    image: onosproject/onos:2.7-latest
    container_name: onos
    hostname: onos
    volumes:
      - ./shared/onos:/root/shared-host
    ports:
      - "6653:6653"
      - "8181:8181"
      - "8101:8101"
    networks:
      - sdn
    stdin_open: true
    tty: true

  #mininet
  mininet:
    build:
      context: ./mininet
      dockerfile: Containerfile
    container_name: mininet
    depends_on:
      - onos
    hostname: mininet
    privileged: true
    volumes:
      - ./shared/mininet:/root/shared-host
      - ../R2/mininet:/root/shared-r2        # scripts y topologías de R2 (admisión, servicios, topo_baseR2)
    networks:
      - sdn
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

  #ldap
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap
    hostname: ldap
    entrypoint: ["/bin/sh", "/sdn/start-ldap.sh"]
    extra_hosts:
      - "ldap-ctrl2:192.168.201.2"
    environment:
      - LDAP_ORGANISATION=RedSDN
      - LDAP_DOMAIN=example.org
      - LDAP_ADMIN_PASSWORD=admin
    volumes:
      - ./shared/ldap/start-compatible.sh:/sdn/start-ldap.sh:ro
      - ./shared/ldap/persistent-tls:/sdn/tls:ro
      - ./shared/ldap/ldif/custom:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - ./shared/ldap/persistent-config:/etc/ldap/slapd.d
      - ./shared/ldap/persistent-data:/var/lib/ldap
      - ./shared/ldap/openldap-backups:/var/lib/openldap/openldap-backups
    ports:
      - "1389:389"
      # - "1636:636" For TLS
    networks:
      sdn:
        ipv4_address: 10.50.0.3

  # policy_mapper
  policy_mapper:
    build:
      context: ./policy_mapper
      dockerfile: Dockerfile
    container_name: policy_mapper
    depends_on:
      - onos
    hostname: policy_mapper
    environment:
      - ONOS_HOST=${ONOS_HOST:-onos}          # en el clúster de 14 VM: la IP de gestión de ONOS (corre en la red del host)
      - ONOS_PORT=8181
      - ONOS_USER=${ONOS_USER:-onos}
      - ONOS_PASSWORD=${ONOS_PASSWORD:-${ONOS_PASS:-}}
      - LDAP_ADMIN_DN=${LDAP_ADMIN_DN:-cn=admin,dc=example,dc=org}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD:-}
      - AAA_CACHE_TTL_S=${AAA_CACHE_TTL_S:-0.05}
      - AGENTE_TOKEN=${AGENTE_TOKEN:-}        # clave del agente 802.1X de los hosts (la genera slice.py)
      - PORTAL_TOKEN=${PORTAL_TOKEN:-}        # clave del servidor del portal cautivo (la genera slice.py)
      - PRESENCIA_TOKEN=${PRESENCIA_TOKEN:-}  # clave con la que la app campus-dhcp de ONOS avisa de un equipo ausente (POST /sessions/ausente); sin ella el endpoint queda desactivado
      - PYTHONPATH=/app:/r2_policy            # policy_tables, portal_auth y policy.yaml viven en R2/policy
    ports:
      - "5000:5000"
    volumes:
      - ./shared/policy_mapper:/app
      - ../R2/policy:/r2_policy:ro
    command: uvicorn policy_mapper:app --host 0.0.0.0 --port 5000 --reload
    networks:
      - sdn
      
  # radius
  radius:
    # image: freeradius/freeradius-server:latest
    build:
      context: ./radius
      dockerfile: Dockerfile
    container_name: radius
    depends_on:
      - ldap
      - policy_mapper
    hostname: radius
    command: ["-X"]
    # Sin `ports`: el RADIUS NO se publica en el host. El AAA de ONOS abre un puerto UDP local con el MISMO número que el del servidor (1812); si ONOS comparte máquina
    # con este contenedor (node-ctrl-1: ONOS usa la red del host), el docker-proxy ya tiene el 1812 y el AAA falla con "BindException: Address already in use" y no puede
    # hablar con RADIUS. ONOS llega a RADIUS por la red de Docker: 10.50.0.250 desde el host (el AAA usa radiusIp=10.50.0.250) o el nombre `radius` desde otro contenedor.
    # La IP fija queda fuera del rango que Docker reparte (empieza en .2), así que no choca con ldap, policy_mapper ni onos.
    networks:
      sdn:
        ipv4_address: 10.50.0.250

networks:
  sdn:
    name: sdn
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/24
          gateway: 10.50.0.1

