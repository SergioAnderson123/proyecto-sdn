# VM Controller (R1 + R2): ONOS, OpenLDAP, Policy Mapper y FreeRADIUS.
# Reutiliza las definiciones de R1/compose.yml (extends) para no duplicar lo que desarrolla el equipo de R1/R2;
# se omite el servicio `mininet`: en VNRT los switches son las VM sw1..sw3 (OVS real) y se conectan a CONTROLLER_IP:6653.
# `extends` no hereda depends_on, por eso se repite aqui.
services:
  onos:
    extends:
      file: ../../compose.yml
      service: onos
    restart: unless-stopped

  ldap:
    extends:
      file: ../../compose.yml
      service: ldap
    restart: unless-stopped

  policy_mapper:
    extends:
      file: ../../compose.yml
      service: policy_mapper
    depends_on:
      - onos
    restart: unless-stopped

  radius:
    extends:
      file: ../../compose.yml
      service: radius
    depends_on:
      - ldap
      - policy_mapper
    restart: unless-stopped

networks:
  sdn:
    name: sdn
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/24
          gateway: 10.50.0.1
