# Conecta los switches OVS (sw1..sw3) al ONOS de la VM Controller.
# Uso:  ansible-playbook -i inventory.ini switches.yml            (aplicar)
#       ansible-playbook -i inventory.ini switches.yml -e reset=true   (ademas borra flujos viejos)
- name: Configurar switches OVS contra el controlador ONOS
  hosts: switches
  become: true
  gather_facts: false
  vars:
    reset: false
  tasks:
    - name: Instalar Open vSwitch si falta
      ansible.builtin.apt:
        name: openvswitch-switch
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Asegurar que el servicio OVS corre
      ansible.builtin.service:
        name: openvswitch-switch
        state: started
        enabled: true

    - name: Fail-mode secure (sin controlador no reenvia)
      ansible.builtin.command: ovs-vsctl set-fail-mode {{ bridge }} secure
      changed_when: true

    - name: Protocolo OpenFlow 1.3
      ansible.builtin.command: ovs-vsctl set bridge {{ bridge }} protocols=OpenFlow13
      changed_when: true

    - name: Apuntar el bridge al controlador
      ansible.builtin.command: ovs-vsctl set-controller {{ bridge }} tcp:{{ controller_ip }}:{{ controller_port }}
      changed_when: true

    - name: Borrar flujos anteriores (solo con -e reset=true)
      ansible.builtin.command: ovs-ofctl -O OpenFlow13 del-flows {{ bridge }}
      when: reset | bool
      changed_when: true

    - name: Esperar la conexion con el controlador
      # La tabla Controller se indexa por UUID, no por bridge: se busca por su target.
      ansible.builtin.command:
        argv:
          - ovs-vsctl
          - --bare
          - --columns=is_connected
          - find
          - Controller
          - 'target="tcp:{{ controller_ip }}:{{ controller_port }}"'
      register: conectado
      until: "'true' in conectado.stdout"
      retries: 10
      delay: 3
      changed_when: false

    - name: Mostrar estado
      ansible.builtin.command: ovs-vsctl show
      register: estado
      changed_when: false

    - ansible.builtin.debug:
        msg: "{{ inventory_hostname }} conectado a {{ controller_ip }}:{{ controller_port }}"
