# Prepara los hosts (h1..h4) como suplicantes 802.1X en VNRT, con el agente web (R1/agente_802_1x).
#   ansible-playbook -i inventory.ini hosts.yml --ask-become-pass                   prepara y habilita el agente (no lo arranca)
#   ansible-playbook -i inventory.ini hosts.yml --ask-become-pass -e arrancar=true   prepara y (re)arranca el agente: se autentica solo
#   ansible-playbook -i inventory.ini hosts.yml --ask-become-pass -e parar=true       para el agente (el suplicante envia el logoff)
#   ansible-playbook -i inventory.ini hosts.yml --ask-become-pass --limit h1          solo un host
#
# El agente (servicio r1-agente) hace de "demonio de la NIC" de una PC real: al arrancar el host autentica solo con la
# identidad asignada en el inventario (`cert`) y, si la interfaz baja y sube, vuelve a autenticar. Ademas ofrece una pagina
# en 127.0.0.1:8080 del host (con un tunel SSH) para elegir otra identidad. Esta habilitado: arranca con el host.
#
# Por que el servicio r1-eapol-bcast: la red virtual de VNRT descarta las tramas a la direccion reservada
# 01:80:c2:00:00:03 (a donde wpa_supplicant manda el EAPOL) antes de que lleguen al switch. Es una limitacion de
# esa red, no del diseno: en una red fisica el EAPOL llega al switch tal cual. El servicio cambia ese destino a
# broadcast al salir del host (tc), que ONOS captura igual porque filtra por eth_type 0x888e.
- name: Preparar hosts como suplicantes 802.1X
  hosts: hosts
  become: true
  gather_facts: false
  vars:
    arrancar: false
    parar: false
    destino: /home/ubuntu/supp
    origen: "{{ playbook_dir }}/../../shared/mininet/supplicants"
    agente_origen: "{{ playbook_dir }}/../../agente_802_1x/agente.py"
    usuario_defecto: "{{ cert | regex_replace('@.*', '') }}"
    mapper_url: "http://{{ controller_ip | default('192.168.0.10') }}:5000"
    # todos los usuarios con certificado: cada host puede autenticarse con cualquiera desde la interfaz web
    usuarios_todos:
      - {uid: profesor01, conf: wpa_profe_01.conf}
      - {uid: profesor02, conf: wpa_profe_02.conf}
      - {uid: alumno01, conf: wpa_alumno_01.conf}
      - {uid: alumno02, conf: wpa_alumno_02.conf}
      - {uid: alumno03, conf: wpa_alumno_03.conf}
      - {uid: support01, conf: wpa_support_01.conf}
  tasks:
    - name: Instalar wpa_supplicant y tcpdump
      ansible.builtin.apt:
        name: [wpasupplicant, tcpdump]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Kernel en uso
      ansible.builtin.command: uname -r
      register: kernel
      changed_when: false

    - name: Modulos extra del kernel en uso (cls_flower y act_pedit para tc; si no existe el paquete se sigue)
      ansible.builtin.apt:
        name: "linux-modules-extra-{{ kernel.stdout }}"
        state: present
      failed_when: false

    - name: Directorios del suplicante
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        mode: "0755"
      loop: ["{{ destino }}", "{{ destino }}/certs"]

    - name: Copiar la CA
      ansible.builtin.copy:
        src: "{{ origen }}/certs/ca.pem"
        dest: "{{ destino }}/certs/ca.pem"
        owner: ubuntu
        mode: "0600"

    - name: Copiar los certificados de todos los usuarios
      ansible.builtin.copy:
        src: "{{ origen }}/certs/{{ item.uid }}@example.org.pem"
        dest: "{{ destino }}/certs/{{ item.uid }}@example.org.pem"
        owner: ubuntu
        mode: "0600"
      loop: "{{ usuarios_todos }}"

    - name: Configuracion del suplicante de cada usuario (con las rutas de este host, no las de Mininet)
      # El contenido ya corregido se escribe en un solo paso: solo marca `changed` si el archivo cambia de verdad.
      ansible.builtin.copy:
        content: "{{ lookup('file', origen + '/' + item.conf) | regex_replace('/root/shared-host/supplicants', destino) }}"
        dest: "{{ destino }}/{{ item.conf }}"
        owner: ubuntu
        mode: "0600"
      loop: "{{ usuarios_todos }}"

    - name: Script que reescribe el destino del EAPOL a broadcast
      register: eapol_script
      ansible.builtin.copy:
        dest: /usr/local/sbin/r1-eapol-bcast.sh
        mode: "0755"
        content: |
          #!/bin/sh
          # R1/VNRT: la red virtual descarta 01:80:c2:00:00:03; el EAPOL sale a broadcast (ONOS lo captura por eth_type).
          IF="$1"
          ip link set "$IF" up
          tc qdisc add dev "$IF" clsact 2>/dev/null || true
          tc filter del dev "$IF" egress 2>/dev/null || true
          tc filter add dev "$IF" egress protocol 0x888e flower dst_mac 01:80:c2:00:00:03 \
            action pedit ex munge eth dst set ff:ff:ff:ff:ff:ff

    - name: Servicio r1-eapol-bcast (persiste tras reiniciar)
      register: eapol_unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/r1-eapol-bcast.service
        content: |
          [Unit]
          Description=R1: EAPOL a broadcast en {{ iface }} (VNRT)
          After=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/r1-eapol-bcast.sh {{ iface }}
          ExecStop=/usr/sbin/tc qdisc del dev {{ iface }} clsact
          [Install]
          WantedBy=multi-user.target

    - name: Quitar el servicio r1-supplicant de versiones anteriores (lo sustituye el agente; dos instancias cruzan el EAP)
      ansible.builtin.systemd:
        name: r1-supplicant
        state: stopped
        enabled: false
      failed_when: false

    - name: Borrar la unidad r1-supplicant
      ansible.builtin.file:
        path: /etc/systemd/system/r1-supplicant.service
        state: absent

    - name: Carpeta del agente
      ansible.builtin.file:
        path: /usr/local/lib/r1-agente
        state: directory
        mode: "0755"

    - name: Copiar el agente 802.1X
      register: agente_codigo
      ansible.builtin.copy:
        src: "{{ agente_origen }}"
        dest: /usr/local/lib/r1-agente/agente.py
        mode: "0755"

    - name: Servicio r1-agente (autentica al arrancar y ofrece la interfaz web en 127.0.0.1:8080)
      register: agente_unidad
      ansible.builtin.copy:
        dest: /etc/systemd/system/r1-agente.service
        mode: "0600"   # lleva la clave R1_TOKEN
        content: |
          [Unit]
          Description=R1: agente 802.1X en {{ iface }} (identidad por defecto {{ usuario_defecto }})
          # Wants y no Requires: reiniciar r1-eapol-bcast NO debe reiniciar el agente (dos arranques seguidos de
          # wpa_supplicant solapan dos conversaciones EAP con la misma MAC y fallan).
          Wants=r1-eapol-bcast.service
          After=r1-eapol-bcast.service network-online.target
          [Service]
          Environment=R1_IFACE={{ iface }}
          Environment=R1_DIR={{ destino }}
          Environment=R1_USUARIO={{ usuario_defecto }}
          Environment=R1_MAPPER={{ mapper_url }}
          Environment=R1_TOKEN={{ agente_token | default('') }}
          ExecStart=/usr/bin/python3 /usr/local/lib/r1-agente/agente.py
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target

    - name: Recargar systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Activar el reescrito de EAPOL (solo se reinicia si cambio el script o la unidad)
      ansible.builtin.systemd:
        name: r1-eapol-bcast
        enabled: true
        state: "{{ 'restarted' if (eapol_script.changed or eapol_unit.changed) else 'started' }}"

    - name: Habilitar el agente (arranca con el host; aqui no se arranca)
      ansible.builtin.systemd:
        name: r1-agente
        enabled: true

    - name: Comprobar si el agente ya estaba en marcha
      ansible.builtin.command: systemctl is-active --quiet r1-agente
      register: agente_activo
      changed_when: false
      failed_when: false

    - name: Reiniciar el agente si cambio su codigo o su unidad y ya estaba en marcha (con arrancar=true se reinicia mas abajo)
      ansible.builtin.systemd:
        name: r1-agente
        state: restarted
      when: (agente_codigo.changed or agente_unidad.changed) and agente_activo.rc == 0 and not (arrancar | bool) and not (parar | bool)

    - name: Parar el agente (-e parar=true)
      ansible.builtin.systemd:
        name: r1-agente
        state: stopped
      when: parar | bool

    - name: Arrancar el agente, que se autentica solo (-e arrancar=true)
      ansible.builtin.systemd:
        name: r1-agente
        state: restarted
      when: arrancar | bool and not (parar | bool)

    - name: MAC de la interfaz de datos
      ansible.builtin.command: cat /sys/class/net/{{ iface }}/address
      register: mac
      changed_when: false

    - name: Resumen
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ iface }} MAC {{ mac.stdout }}; identidad por defecto {{ usuario_defecto }}; interfaz web en 127.0.0.1:8080 del host"
