# Prepara los hosts (h1..h4) como suplicantes 802.1X en VNRT.
#   ansible-playbook -i inventory.ini hosts.yml --ask-become-pass                 prepara (no arranca el suplicante)
#   ansible-playbook -i inventory.ini hosts.yml --ask-become-pass -e arrancar=true   prepara y arranca el suplicante
#   ansible-playbook -i inventory.ini hosts.yml --ask-become-pass -e parar=true       para el suplicante
#   ansible-playbook -i inventory.ini hosts.yml --ask-become-pass --limit h1          solo un host
#
# Por que el servicio r1-eapol-bcast: la red virtual de VNRT descarta las tramas a la direccion reservada
# 01:80:c2:00:00:03 (a donde wpa_supplicant manda el EAPOL) antes de que lleguen al switch. Es una limitacion de
# esa red, no del diseno: en una red fisica el EAPOL llega al switch tal cual. El servicio cambia ese destino a
# broadcast al salir del host (tc), que ONOS captura igual porque filtra por eth_type 0x888e.
- name: Preparar hosts como suplicantes 802.1X
  hosts: hosts
  become: true
  gather_facts: false
  vars:
    arrancar: false
    parar: false
    destino: /home/ubuntu/supp
    origen: "{{ playbook_dir }}/../../shared/mininet/supplicants"
  tasks:
    - name: Instalar wpa_supplicant y tcpdump
      ansible.builtin.apt:
        name: [wpasupplicant, tcpdump]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Kernel en uso
      ansible.builtin.command: uname -r
      register: kernel
      changed_when: false

    - name: Modulos extra del kernel en uso (cls_flower y act_pedit para tc; si no existe el paquete se sigue)
      ansible.builtin.apt:
        name: "linux-modules-extra-{{ kernel.stdout }}"
        state: present
      failed_when: false

    - name: Directorios del suplicante
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        mode: "0755"
      loop: ["{{ destino }}", "{{ destino }}/certs"]

    - name: Copiar la CA y el certificado del usuario
      ansible.builtin.copy:
        src: "{{ origen }}/certs/{{ item }}"
        dest: "{{ destino }}/certs/{{ item }}"
        owner: ubuntu
        mode: "0600"
      loop: ["ca.pem", "{{ cert }}"]

    - name: Copiar la configuracion del suplicante
      ansible.builtin.copy:
        src: "{{ origen }}/{{ conf }}"
        dest: "{{ destino }}/{{ conf }}"
        owner: ubuntu
        mode: "0600"

    - name: Rutas del suplicante apuntan a este host (no a /root/shared-host de Mininet)
      ansible.builtin.replace:
        path: "{{ destino }}/{{ conf }}"
        regexp: '/root/shared-host/supplicants'
        replace: "{{ destino }}"

    - name: Script que reescribe el destino del EAPOL a broadcast
      ansible.builtin.copy:
        dest: /usr/local/sbin/r1-eapol-bcast.sh
        mode: "0755"
        content: |
          #!/bin/sh
          # R1/VNRT: la red virtual descarta 01:80:c2:00:00:03; el EAPOL sale a broadcast (ONOS lo captura por eth_type).
          IF="$1"
          ip link set "$IF" up
          tc qdisc add dev "$IF" clsact 2>/dev/null || true
          tc filter del dev "$IF" egress 2>/dev/null || true
          tc filter add dev "$IF" egress protocol 0x888e flower dst_mac 01:80:c2:00:00:03 \
            action pedit ex munge eth dst set ff:ff:ff:ff:ff:ff

    - name: Servicio r1-eapol-bcast (persiste tras reiniciar)
      ansible.builtin.copy:
        dest: /etc/systemd/system/r1-eapol-bcast.service
        content: |
          [Unit]
          Description=R1: EAPOL a broadcast en {{ iface }} (VNRT)
          After=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/r1-eapol-bcast.sh {{ iface }}
          ExecStop=/usr/sbin/tc qdisc del dev {{ iface }} clsact
          [Install]
          WantedBy=multi-user.target

    - name: Servicio r1-supplicant (arranque manual; no se habilita al inicio)
      ansible.builtin.copy:
        dest: /etc/systemd/system/r1-supplicant.service
        content: |
          [Unit]
          Description=R1: wpa_supplicant 802.1X en {{ iface }} ({{ conf }})
          Requires=r1-eapol-bcast.service
          After=r1-eapol-bcast.service
          [Service]
          ExecStart=/usr/sbin/wpa_supplicant -D wired -i {{ iface }} -c {{ destino }}/{{ conf }}
          Restart=no

    - name: Activar el reescrito de EAPOL
      ansible.builtin.systemd:
        daemon_reload: true
        name: r1-eapol-bcast
        enabled: true
        state: restarted

    - name: Parar el suplicante (-e parar=true)
      ansible.builtin.systemd:
        name: r1-supplicant
        state: stopped
      when: parar | bool

    - name: Arrancar UNA sola instancia del suplicante (-e arrancar=true)
      ansible.builtin.systemd:
        name: r1-supplicant
        state: restarted
      when: arrancar | bool and not (parar | bool)

    - name: MAC de la interfaz de datos
      ansible.builtin.command: cat /sys/class/net/{{ iface }}/address
      register: mac
      changed_when: false

    - name: Resumen
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ iface }} MAC {{ mac.stdout }} usuario {{ cert | regex_replace('@.*', '') }}"
