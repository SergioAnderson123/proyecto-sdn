# PRUEBA EN VIVO de la app DHCP por subred (82) con interfaces MACVLAN en h1: cada una tiene su propia MAC (02:aa:bb:00:01:NN) y entra por acc-1/1 como un equipo distinto, SIN tocar la IP real de h1.
#   PLAYBOOK=83_prueba_dhcp.yml ./lanzar.sh                              # prueba=una: un cliente pide IP, se mira ONOS y el vigilante, y libera (RELEASE)
#   PLAYBOOK=83_prueba_dhcp.yml ./lanzar.sh -e prueba=agotamiento        # 6 clientes con MAC distintas a la vez: la CUOTA por puerto (3) debe dejar solo 3 con IP
#   PLAYBOOK=83_prueba_dhcp.yml ./lanzar.sh -e prueba=ocupada            # SONDEO ARP PREVIO (opcion B): una macvlan `sq1` hace de equipo con IP FIJA (10.0.1.150, dentro del ambito .100-.199) y el cliente PIDE esa IP: el servidor no debe ofrecerla
# prueba=ocupada deja UNA regla /32 de 10.0.1.150 en acc-1 (y la de la MAC de sq1): el vigilante recuerda a sq1 aunque se borre de ONOS. Con el 68 reaplicado (olvidar_host, docs/DISENO_CAPA3.md V9 ter) se retira sola a los 900 s; antes, o con olvidar_host vacio, se retira reiniciando el servicio: ssh ubuntu@192.168.201.3 'sudo systemctl restart vigilante-capa3' (95 antes y despues).
# Requisitos: 82_dhcp_app.yml aplicado (la app DHCP estandar desactivada). Antes y despues: PLAYBOOK=95_diagnostico_lazos.yml ./lanzar.sh.
# El cliente es files/cliente_dhcp_prueba.py (DISCOVER, REQUEST y RELEASE por un socket crudo): NO configura ninguna IP, ruta ni DNS en h1 y no depende de dhclient. Sus tramas se comprobaron contra el servidor Java (ClientePruebaTest).
# Los clientes corren con `async` de Ansible: en dos intentos con `nohup ... &` el proceso moria al cerrarse la tarea y nunca enviaba su RELEASE. Las interfaces y los procesos se borran SIEMPRE al final; h1 no pierde su IP, su ruta ni su sesion.
# Si VNRT filtrara por MAC de origen en el puerto de h1, no habria respuesta ("SIN_OFERTA" en todas), sin ningun efecto en la red.
- name: Prueba DHCP, paso 1 - clientes macvlan en h1 piden IP
  hosts: h1-profesor
  become: true
  gather_facts: false
  vars:
    prueba: una
    n: "{{ 6 if prueba == 'agotamiento' else 1 }}"
    mantener: "{{ 45 if prueba == 'agotamiento' else 15 }}"
    ip_ocupada: 10.0.1.150          # prueba=ocupada: la IP fija del equipo simulado y la que pide el cliente
    mac_ocupada: "02:aa:bb:00:01:0f"
  tasks:
    - name: Copiar el cliente de prueba
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/cliente_dhcp_prueba.py"
        dest: /tmp/cliente_dhcp_prueba.py
        mode: "0755"

    - name: Quitar restos de una prueba anterior (etiqueta limpiar, para solo limpiar usar --tags limpiar)
      ansible.builtin.shell:
        cmd: |
          touch /tmp/dhcp_prueba_parar; sleep 3
          pkill -TERM -f '[c]liente_dhcp_prueba.py' 2>/dev/null; sleep 1
          for i in 1 2 3 4 5 6; do ip link del dhc$i 2>/dev/null; rm -f /tmp/dhcp_prueba_dhc$i.json /tmp/dhc$i.log; done
          ip link del sq1 2>/dev/null
          [ -f /tmp/arp_ignore_ens4.orig ] && sysctl -qw net.ipv4.conf.ens4.arp_ignore=$(cat /tmp/arp_ignore_ens4.orig) && rm -f /tmp/arp_ignore_ens4.orig
          rm -f /tmp/dhcp_prueba_parar
          true
      changed_when: false
      tags: [probar, limpiar]

    - name: prueba=ocupada, crear el equipo con IP fija (macvlan sq1 con 10.0.1.150/32 y su propia MAC); ens4 deja de contestar por IPs que no son suyas (arp_ignore=1, se restaura al limpiar) para que conteste SOLO sq1
      ansible.builtin.shell:
        cmd: |
          cat /proc/sys/net/ipv4/conf/ens4/arp_ignore > /tmp/arp_ignore_ens4.orig
          sysctl -qw net.ipv4.conf.ens4.arp_ignore=1
          ip link add link ens4 name sq1 address {{ mac_ocupada }} type macvlan mode bridge
          ip link set sq1 up
          ip addr add {{ ip_ocupada }}/32 dev sq1
          ip -br addr show sq1
          echo "arp_ignore de ens4 (antes: $(cat /tmp/arp_ignore_ens4.orig)): $(cat /proc/sys/net/ipv4/conf/ens4/arp_ignore)"
      register: squatter
      changed_when: true
      when: prueba == 'ocupada'

    - name: prueba=ocupada, el equipo simulado
      ansible.builtin.debug:
        msg: "{{ squatter.stdout_lines }}"
      when: prueba == 'ocupada'

    - name: Crear las interfaces macvlan de prueba
      ansible.builtin.shell:
        cmd: |
          for i in $(seq {{ n }}); do
            ip link add link ens4 name dhc$i address 02:aa:bb:00:01:0$i type macvlan mode bridge
            ip link set dhc$i up
          done
          ip -br link show | grep dhc
      register: ifaces
      changed_when: true

    - name: Lanzar los clientes todos a la vez (async de Ansible; cada uno termina solo tras enviar su RELEASE)
      ansible.builtin.shell:
        cmd: "python3 /tmp/cliente_dhcp_prueba.py --iface dhc{{ item }} --mac 02:aa:bb:00:01:0{{ item }} --salida /tmp/dhcp_prueba_dhc{{ item }}.json --mantener {{ mantener }}{{ (' --pedir ' ~ ip_ocupada) if prueba == 'ocupada' else '' }} > /tmp/dhc{{ item }}.log 2>&1"
      async: 150
      poll: 0
      loop: "{{ range(1, n | int + 1) | list }}"
      register: clientes
      changed_when: true

    - name: Esperar hasta 30 s a que cada cliente termine de negociar y mostrar lo que recibio
      ansible.builtin.shell:
        cmd: |
          for s in $(seq 30); do
            listos=0
            for i in $(seq {{ n }}); do [ -s /tmp/dhcp_prueba_dhc$i.json ] && listos=$((listos + 1)); done
            [ "$listos" -eq {{ n }} ] && break
            sleep 1
          done
          conseguidas=0
          for i in $(seq {{ n }}); do
            echo "dhc$i: $(cat /tmp/dhcp_prueba_dhc$i.json 2>/dev/null || echo sin-resultado)"
            grep -q '"estado": "ACK"' /tmp/dhcp_prueba_dhc$i.json 2>/dev/null && conseguidas=$((conseguidas + 1))
          done
          echo "clientes con IP (ACK): $conseguidas de {{ n }}"
      register: pedido
      changed_when: false

    - name: Lo que recibio cada cliente
      ansible.builtin.debug:
        msg: "{{ pedido.stdout_lines }}"

- name: Prueba DHCP, paso 2 - lo que ONOS y el vigilante saben con los clientes conectados (switch-borde)
  hosts: borde
  gather_facts: false
  vars:
    karaf: [sshpass, -p, "{{ onos_pass }}", ssh, -p, "8101", -o, StrictHostKeyChecking=no, -o, UserKnownHostsFile=/dev/null, "{{ onos_user }}@{{ onos_ip }}"]
  tasks:
    - name: Esperar 8 s (el vigilante revisa cada 5 s)
      ansible.builtin.shell:
        cmd: "sleep 8"
      changed_when: false

    - name: Equipos de la prueba en ONOS y reglas de entrega /32 en acc-1
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/files/hosts_dhcp_prueba.py --onos http://{{ onos_ip }}:8181 --usuario {{ onos_user }}:{{ onos_pass }}"
      register: onos
      changed_when: false

    - name: Log de la app DHCP en ONOS (ultimas lineas)
      ansible.builtin.shell:
        cmd: "{{ karaf | join(' ') }} 'log:display' 2>/dev/null | grep -i 'DHCP por subred' | tail -14 | sed 's/\\x1b\\[[0-9;]*m//g' | cut -c1-200"
      register: logapp
      changed_when: false
      failed_when: false

    - name: Informe
      ansible.builtin.debug:
        msg:
          - "{{ onos.stdout_lines }}"
          - "{{ logapp.stdout_lines }}"
          - "Esperado (prueba=una): 1 equipo con IP de 10.0.1.100 a 199, ubicado en acc-1/1, con regla_entrega_32=SI. Esperado (prueba=agotamiento): solo 3 equipos con IP (maxPorPuerto) y en el log un aviso de cuota agotada. Esperado (prueba=ocupada): el cliente recibe ACK con una IP DISTINTA de 10.0.1.150 (con el sondeo previo activo; con `-e sondeo_previo_ms=0` en el 82 recibiria 10.0.1.150, la IP del equipo fijo), y el log trae 'la IP 10.0.1.150 ya la usa 02:aa:bb:00:01:0f ... se aparta y se busca otra'."

- name: Prueba DHCP, paso 3 - esperar el RELEASE y limpiar (siempre)
  hosts: h1-profesor
  become: true
  gather_facts: false
  vars:
    prueba: una
  tasks:
    - name: Parar, esperar el RELEASE y mostrar el registro
      block:
        - name: Prueba agotamiento, pedir la parada ordenada (cada cliente envia su RELEASE y termina; sin senales para no matar el shell de Ansible)
          ansible.builtin.shell:
            cmd: "touch /tmp/dhcp_prueba_parar; sleep 3"
          changed_when: false
          when: prueba == 'agotamiento'

        - name: Esperar a que terminen los clientes (ya enviaron su RELEASE)
          ansible.builtin.async_status:
            jid: "{{ item.ansible_job_id }}"
          loop: "{{ clientes.results }}"
          register: fin
          until: fin.finished
          retries: 40
          delay: 2

        - name: Registro de cada cliente (debe decir RELEASE enviado)
          ansible.builtin.shell:
            cmd: "for i in 1 2 3 4 5 6; do [ -f /tmp/dhc$i.log ] && echo \"dhc$i: $(tr '\\n' '|' < /tmp/dhc$i.log)\"; done; true"
          register: registros
          changed_when: false

        - name: Lo que hizo cada cliente
          ansible.builtin.debug:
            msg: "{{ registros.stdout_lines }}"
      always:
        - name: Borrar las interfaces y archivos de prueba
          ansible.builtin.shell:
            cmd: |
              touch /tmp/dhcp_prueba_parar; sleep 1
              for i in 1 2 3 4 5 6; do ip link del dhc$i 2>/dev/null; rm -f /tmp/dhcp_prueba_dhc$i.json /tmp/dhc$i.log; done
              ip link del sq1 2>/dev/null
              [ -f /tmp/arp_ignore_ens4.orig ] && sysctl -qw net.ipv4.conf.ens4.arp_ignore=$(cat /tmp/arp_ignore_ens4.orig) && rm -f /tmp/arp_ignore_ens4.orig
              rm -f /tmp/cliente_dhcp_prueba.py /tmp/dhcp_prueba_parar
              echo "interfaces dhc y sq que quedan: $(ip -br link show | grep -c -E 'dhc|sq1')"
              echo "arp_ignore de ens4: $(cat /proc/sys/net/ipv4/conf/ens4/arp_ignore) (el de siempre es 0)"
              echo "direcciones de ens4: $(ip -4 -o addr show dev ens4 | awk '{print $4}' | tr '\n' ' ')"
          register: limpio
          changed_when: true
          tags: [probar, limpiar]

        - name: Estado tras limpiar (h1 conserva su IP real)
          ansible.builtin.debug:
            msg: "{{ limpio.stdout_lines }}"
          tags: [probar, limpiar]

- name: Prueba DHCP, paso 4 - ONOS tras los RELEASE (las IP deben haberse retirado)
  hosts: borde
  gather_facts: false
  tasks:
    - name: Esperar 6 s
      ansible.builtin.shell:
        cmd: "sleep 6"
      changed_when: false

    - name: prueba=ocupada, borrar de ONOS el equipo simulado (ONOS lo aprendio por su respuesta ARP; la MAC es de la prueba, no de h1)
      ansible.builtin.uri:
        url: "http://{{ onos_ip }}:8181/onos/v1/hosts/02:AA:BB:00:01:0F/None"
        method: DELETE
        user: "{{ onos_user }}"
        password: "{{ onos_pass }}"
        force_basic_auth: true
        status_code: [200, 204, 404]
      when: prueba | default('una') == 'ocupada'

    - name: Equipos de la prueba en ONOS (ips=[] = retiradas) y reglas de entrega que quedan
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/files/hosts_dhcp_prueba.py --onos http://{{ onos_ip }}:8181 --usuario {{ onos_user }}:{{ onos_pass }}"
      register: tras
      changed_when: false

    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ tras.stdout_lines }}"
