# Prepara un solo host (por defecto h1-profesor) como suplicante 802.1X.
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh                                   # prepara h1-profesor; NO autentica
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh -e arrancar=true                  # arranca solo h1-profesor (con su identidad por defecto del inventario: alumno02)
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh -e arrancar=true -e identidad=profesor01   # h1 entra como profesor01 (demostracion); sin -e identidad vuelve a alumno02
# LOGIN MANUAL (login_manual=true en el inventario, es lo que hay hoy): el agente no autentica solo y estos comandos NO conectan ni desconectan a nadie; solo cambian
# que identidades aparecen en la lista de la interfaz web del host (la lista se lee en vivo de los wpa_*.conf, sin reiniciar el agente). El login se hace en la interfaz:
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh -e identidad=profesor01     # la lista de h1 gana profesor01 (desconecta antes lo que este conectado como alumno)
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh                             # h1 vuelve a la lista de alumnos (profesor01 desaparece de h1; desconectalo antes en la interfaz)
#   interfaz web: ssh -L 8081:127.0.0.1:8080 -p 5821 ubuntu@10.20.11.14 (h1) y ssh -L 8082:127.0.0.1:8080 -p 5822 ubuntu@10.20.11.14 (h2), y http://localhost:8081 / :8082
#   (identidad: alumno01|alumno02|alumno03|profesor01|profesor02|support01. Cambiarla deja en el host solo los certificados de esa identidad y de los alumnos:
#    el de profesor desaparece del host al volver a alumno.)
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh -e parar=true                     # para solo h1-profesor (envía logoff)
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh -e objetivo_host=h2-alumno -e arrancar=true  # selecciona explícitamente h2
# Lo que cambia en el host: paquetes (wpasupplicant, tcpdump), /home/ubuntu/supp, el servicio r1-eapol-bcast (un filtro tc de salida en ens4 que cambia el
# destino del EAPOL 01:80:c2:00:00:03, que la red virtual de VNRT descarta, a broadcast) y el servicio r1-agente (habilitado, no arrancado). La red no cambia:
# el EAPOL va al controlador por la regla de ONOS (prioridad 40000, tipo 0x888e) y nunca se inunda.
# La clave del agente (AGENTE_TOKEN) se copia del .env de node-ctrl-1 (la crea 74_token_agente.yml): con ella el agente avisa al Policy Mapper del cierre de sesión.
# Sin clave el agente lo dice en su bitácora ("Sin R1_TOKEN") y la sesión no se cierra.
- name: Clave del agente tomada del .env de node-ctrl-1
  hosts: servicios
  gather_facts: false
  vars:
    host_objetivo: "{{ objetivo_host | default('h1-profesor') }}"
    # identidad -> suplicante (los .conf estan en R1/shared/mininet/supplicants)
    identidades:
      alumno01: wpa_alumno_01.conf
      alumno02: wpa_alumno_02.conf
      alumno03: wpa_alumno_03.conf
      profesor01: wpa_profe_01.conf
      profesor02: wpa_profe_02.conf
      support01: wpa_support_01.conf
  tasks:
    - name: Aceptar solo un host del grupo 802.1X
      ansible.builtin.assert:
        that:
          - host_objetivo in groups['hosts']
        fail_msg: "objetivo_host debe ser h1-profesor o h2-alumno"
        quiet: true

    - name: Identidad pedida (-e identidad=...) conocida
      ansible.builtin.assert:
        that:
          - identidad in identidades
        fail_msg: "identidad debe ser una de: {{ identidades.keys() | list | join(', ') }}"
        quiet: true
      when: identidad is defined

    - name: Cambiar la identidad por defecto de ese host (sustituye cert y conf del inventario solo en esta ejecucion)
      ansible.builtin.set_fact:
        cert: "{{ identidad }}@example.org.pem"
        conf: "{{ identidades[identidad] }}"
      delegate_to: "{{ host_objetivo }}"
      delegate_facts: true
      when: identidad is defined

    - name: Leer AGENTE_TOKEN (sin mostrarla)
      ansible.builtin.shell: grep '^AGENTE_TOKEN=' {{ repo_dir }}/R1/deploy/.env | head -1 | cut -d= -f2 | tr -d '\n'
      register: tok
      changed_when: false
      failed_when: false
      no_log: true

    - name: Pasarla a los hosts con 802.1X
      ansible.builtin.set_fact:
        agente_token: "{{ tok.stdout | default('') }}"
      delegate_to: "{{ host_objetivo }}"
      delegate_facts: true
      no_log: true

- name: Preparar el host seleccionado como suplicante 802.1X
  ansible.builtin.import_playbook: ../hosts/hosts.yml
  vars:
    hosts_objetivo: "{{ objetivo_host | default('h1-profesor') }}"
