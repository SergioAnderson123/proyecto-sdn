# Prepara un solo host (por defecto h1-profesor) como suplicante 802.1X.
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh                                   # prepara h1-profesor; NO autentica
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh -e arrancar=true                  # arranca solo h1-profesor
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh -e parar=true                     # para solo h1-profesor (envía logoff)
#   PLAYBOOK=72_suplicante.yml ./lanzar.sh -e objetivo_host=h2-alumno -e arrancar=true  # selecciona explícitamente h2
# Lo que cambia en el host: paquetes (wpasupplicant, tcpdump), /home/ubuntu/supp, el servicio r1-eapol-bcast (un filtro tc de salida en ens4 que cambia el
# destino del EAPOL 01:80:c2:00:00:03, que la red virtual de VNRT descarta, a broadcast) y el servicio r1-agente (habilitado, no arrancado). La red no cambia:
# el EAPOL va al controlador por la regla de ONOS (prioridad 40000, tipo 0x888e) y nunca se inunda.
# La clave del agente (AGENTE_TOKEN) se copia del .env de node-ctrl-1 (la crea 74_token_agente.yml): con ella el agente avisa al Policy Mapper del cierre de sesión.
# Sin clave el agente lo dice en su bitácora ("Sin R1_TOKEN") y la sesión no se cierra.
- name: Clave del agente tomada del .env de node-ctrl-1
  hosts: servicios
  gather_facts: false
  vars:
    host_objetivo: "{{ objetivo_host | default('h1-profesor') }}"
  tasks:
    - name: Aceptar solo un host del grupo 802.1X
      ansible.builtin.assert:
        that:
          - host_objetivo in groups['hosts']
        fail_msg: "objetivo_host debe ser h1-profesor o h2-alumno"
        quiet: true

    - name: Leer AGENTE_TOKEN (sin mostrarla)
      ansible.builtin.shell: grep '^AGENTE_TOKEN=' {{ repo_dir }}/R1/deploy/.env | head -1 | cut -d= -f2 | tr -d '\n'
      register: tok
      changed_when: false
      failed_when: false
      no_log: true

    - name: Pasarla a los hosts con 802.1X
      ansible.builtin.set_fact:
        agente_token: "{{ tok.stdout | default('') }}"
      delegate_to: "{{ host_objetivo }}"
      delegate_facts: true
      no_log: true

- name: Preparar el host seleccionado como suplicante 802.1X
  ansible.builtin.import_playbook: ../hosts/hosts.yml
  vars:
    hosts_objetivo: "{{ objetivo_host | default('h1-profesor') }}"
