# COMPROBACION PREVIA de la conmutacion a capa 3 (docs/PLAN_CONMUTACION_CAPA3.md). SOLO LECTURA: no cambia ningun flujo, servicio ni IP.
#   PLAYBOOK=66_preflight_conmutacion.yml ./lanzar.sh
# Muestra: el estado del vigilante L2 y de la app Gateway ARP, los enlaces de ONOS, las IP actuales de los hosts y lo que haria el vigilante en modo capa 3 EN LA TABLA 60 con el plan real (diferencia, sin aplicar).
- name: Preflight 1 - estado de ONOS, app y vigilante en modo capa 3 simulado (switch-borde)
  hosts: borde
  gather_facts: false
  vars:
    app: org.campus.gatewayarp
    api: "http://{{ onos_ip }}:8181/onos/v1"
    carpeta_codigo: "{{ playbook_dir }}/../../../R2/policy"
    contar: "python3 {{ playbook_dir }}/files/contar_flujos.py --onos http://{{ onos_ip }}:8181 --usuario {{ onos_user }}:{{ onos_pass }} --app {{ app }}"
  tasks:
    - name: Enlaces de ONOS (esperados 14 dirigidos)
      ansible.builtin.uri:
        url: "{{ api }}/links"
        user: "{{ onos_user }}"
        password: "{{ onos_pass }}"
        force_basic_auth: true
        return_content: true
      register: enlaces

    - name: Flujos por switch y de la app
      ansible.builtin.command:
        cmd: "{{ contar }}"
      register: cuentas
      changed_when: false

    - name: Lo que haria el vigilante en modo capa 3 en la tabla 60 (SIN aplicar)
      ansible.builtin.command:
        cmd: >-
          python3 vigilante.py --onos http://{{ onos_ip }}:8181 --subredes planes/vnrt_topologia14.json --nucleo core-1,core-2,borde
          --hosts-fijos planes/hosts_fijos_capa3.json --una-vez --estable 0 --max-cambios 5000
        chdir: "{{ carpeta_codigo }}"
      register: simulado
      changed_when: false

    - name: Informe
      ansible.builtin.debug:
        msg:
          - "enlaces dirigidos en ONOS: {{ enlaces.json.links | length }} (esperados 14)"
          - "{{ cuentas.stdout_lines }}"
          - "{{ simulado.stdout_lines }}"

- name: Preflight 2 - servicio del vigilante L2 (node-ctrl-3 principal, node-ctrl-2 respaldo)
  hosts: node-ctrl-3:node-ctrl-2
  become: true
  gather_facts: false
  tasks:
    - name: Estado y linea de comandos del servicio
      ansible.builtin.shell:
        cmd: "systemctl is-active vigilante; grep ExecStart /etc/systemd/system/vigilante.service | cut -c1-220; journalctl -u vigilante -n 3 --no-pager | cut -c1-200"
      register: servicio
      changed_when: false
      failed_when: false

    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ servicio.stdout_lines }}"

- name: Preflight 3 - IP y rutas actuales de los hosts
  hosts: h1-profesor:h2-alumno:server
  become: true
  gather_facts: false
  vars:
    plan_a:
      h1-profesor: "10.0.1.101/24 fija (plan A) o una IP DHCP del ambito 10.0.1.100-199, con gw 10.0.1.254"
      h2-alumno: "10.0.2.102/24 fija (plan A) o una IP DHCP del ambito 10.0.2.100-199 (94_hosts_dhcp.yml), con gw 10.0.2.254"
      server: "10.0.0.10/24 con rutas 10.0.1.0/24 y 10.0.2.0/24 por 10.0.0.254"
  tasks:
    - name: Direcciones y rutas de ens4
      ansible.builtin.shell:
        cmd: "ip -4 -o addr show dev ens4 | awk '{print $4}' | tr '\\n' ' '; echo; ip route | grep -E '10\\.0\\.' | tr '\\n' ';'"
      register: red
      changed_when: false

    - name: Resultado frente al plan A
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} tiene: {{ red.stdout_lines }}"
          - "plan A pide: {{ plan_a[inventory_hostname] }}"
