# Fase 1b: ONOS + OpenLDAP + Policy Mapper + FreeRADIUS en node-ctrl-1, con el deploy que ya existe en el repo
# (R1/deploy/controller/up.sh: docker compose + init-onos.sh).
- name: Desplegar el controlador (R1 + R2)
  hosts: onos_inicial
  gather_facts: false
  tasks:
    - name: Clonar o actualizar el repo
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ repo_rama }}"
        update: true
        force: false

    - name: Scripts ejecutables
      ansible.builtin.file:
        path: "{{ repo_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - R1/deploy/controller/up.sh
        - R1/deploy/controller/init-onos.sh

    - name: ".env del controlador (no se pisa si ya existe; slice.py puede haber agregado claves)"
      ansible.builtin.copy:
        dest: "{{ repo_dir }}/R1/deploy/.env"
        mode: "0600"
        force: false
        content: |
          CONTROLLER_IP={{ onos_ip }}
          ONOS_USER={{ onos_user }}
          ONOS_PASS={{ onos_pass }}

    - name: "Levantar los contenedores y configurar ONOS (tarda, porque construye imagenes y baja ONOS)"
      ansible.builtin.command: bash up.sh
      args:
        chdir: "{{ repo_dir }}/R1/deploy/controller"
      async: 2400
      poll: 20
      register: up
      changed_when: true

    - name: Ultimas lineas de la salida
      ansible.builtin.debug:
        msg: "{{ up.stdout_lines[-12:] }}"

    - name: La API REST de ONOS responde
      ansible.builtin.uri:
        url: "http://127.0.0.1:8181/onos/v1/applications"
        user: "{{ onos_user }}"
        password: "{{ onos_pass }}"
        force_basic_auth: true
        return_content: true
      register: apps
      until: apps.status == 200
      retries: 20
      delay: 6

    - name: Apps ACTIVE
      ansible.builtin.debug:
        msg: "{{ apps.json.applications | selectattr('state', 'equalto', 'ACTIVE') | map(attribute='name') | list }}"
