# Inventario de la topologia oficial de VNRT (14 VM). Red de gestion (roja, ens3): 192.168.201.0/24.
# Se ejecuta desde switch-borde (nodo de control de Ansible).
# Nombres = hostnames de las VM. vm-atacante no esta en la red roja y no se gestiona desde aqui.

[borde]
switch-borde ansible_connection=local

[ctrl]
node-ctrl-1 ansible_host=192.168.201.1
node-ctrl-2 ansible_host=192.168.201.2
node-ctrl-3 ansible_host=192.168.201.3

# Fase 1: un solo ONOS (con LDAP, RADIUS y Policy Mapper) en node-ctrl-1
[onos_inicial]
node-ctrl-1

[cores]
sw-core-1 ansible_host=192.168.201.13
sw-core-2 ansible_host=192.168.201.14

[accs]
sw-acc-1 ansible_host=192.168.201.11
sw-acc-2 ansible_host=192.168.201.12

[switches:children]
borde
cores
accs

[sec]
node-sec-1 ansible_host=192.168.201.31
node-sec-2 ansible_host=192.168.201.32

[hosts_prueba]
h1-profesor ansible_host=192.168.201.21
h2-alumno ansible_host=192.168.201.22
server ansible_host=192.168.201.23

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
