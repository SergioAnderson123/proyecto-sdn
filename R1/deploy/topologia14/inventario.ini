# Inventario de la topologia oficial de VNRT (14 VM). Red de gestion (roja, ens3): 192.168.201.0/24.
# Se ejecuta desde switch-borde (nodo de control de Ansible).
# Nombres = hostnames de las VM. vm-atacante no esta en la red roja y no se gestiona desde aqui.

[borde]
switch-borde ansible_connection=local

[ctrl]
node-ctrl-1 ansible_host=192.168.201.1
node-ctrl-2 ansible_host=192.168.201.2
node-ctrl-3 ansible_host=192.168.201.3

# Fase 1: un solo ONOS (con LDAP, RADIUS y Policy Mapper) en node-ctrl-1
[onos_inicial]
node-ctrl-1

# Fase 3 (clúster): servicios R1/R2 (LDAP, RADIUS, Policy Mapper). Primero solo en node-ctrl-1; replicar a node-ctrl-2 es una etapa posterior
[servicios]
node-ctrl-1

[cores]
sw-core-1 ansible_host=192.168.201.13
sw-core-2 ansible_host=192.168.201.14

[accs]
# OJO: los nombres siguen a los de la interfaz web de VNRT, que estan cruzados respecto al PDF de IP: la VM de 192.168.201.12 es sw-acc-1 y la de
# 192.168.201.11 es sw-acc-2. Ver TOPOLOGIA.md.
sw-acc-1 ansible_host=192.168.201.12
sw-acc-2 ansible_host=192.168.201.11

[switches:children]
borde
cores
accs

[sec]
node-sec-1 ansible_host=192.168.201.31
node-sec-2 ansible_host=192.168.201.32

[hosts_prueba]
h1-profesor ansible_host=192.168.201.21
h2-alumno ansible_host=192.168.201.22
server ansible_host=192.168.201.23

# Hosts con 802.1X (los prepara 72_suplicante.yml con R1/deploy/hosts/hosts.yml): h1-profesor (sw-acc-1, puerto 1) y h2-alumno (sw-acc-2, puerto 1).
# iface = interfaz de datos; conf y cert = identidad por defecto de ese host (alumno02 en h1 y alumno01 en h2: los equipos son de alumno y el rol Docente se
# obtiene por el portal, con el ascenso). Para demostrar un profesor con 802.1X: 72_suplicante.yml -e arrancar=true -e identidad=profesor01 (sin -e vuelve a alumno02).
# Sin comentarios al final de una variable.
[hosts]
h1-profesor iface=ens4 conf=wpa_alumno_02.conf cert=alumno02@example.org.pem ip_datos=10.0.0.201
h2-alumno iface=ens4 conf=wpa_alumno_01.conf cert=alumno01@example.org.pem ip_datos=10.0.0.202

[hosts:vars]
# Login manual: el agente de cada host NO autentica solo; la identidad se elige y se conecta desde su interfaz web (127.0.0.1:8080 del host, por un tunel SSH).
# 72_suplicante.yml solo decide que identidades hay en la lista (-e identidad=profesor01 agrega la de profesor; sin -e quedan las de alumno).
login_manual=true
# El agente 802.1X de h1 y h2 avisa aqui al Policy Mapper (R1_MAPPER=http://<controller_ip>:5000). Con el mapper HA ese puerto lo sirve el gateway (switch-borde, .254):
# en ctrl-1 ya no escucha nada y los avisos de cierre de sesion se perdian. (El comentario va en su propia linea: al final de controller_ip rompe el valor.)
controller_ip=192.168.201.254

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
