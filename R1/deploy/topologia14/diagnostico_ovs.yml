# Solo lectura. Cuenta, por hora y por controlador, las veces que cada switch OVS perdio su conexion OpenFlow con un nodo de ONOS (`no response to inactivity probe`, `connection closed`, `dropped`...) y muestra
# como esta configurado el controlador (inactivity_probe, backoff, estado). Sirve para saber SI las rachas de ONOS hacen que los switches suelten a un controlador: el 23-nov a las 18:15:23 los 5 switches
# se desconectaron a la vez del ONOS de ctrl-1 y, al volver, ese nodo (y despues ctrl-3) vio los switches con available=false (docs/DISENO_CAPA3.md, V9 quinquies).
#   PLAYBOOK=diagnostico_ovs.yml ./lanzar.sh
#   PLAYBOOK=diagnostico_ovs.yml ./lanzar.sh -e dias=1       # ventana (dias de log leidos; por defecto 2)
- name: Desconexiones OpenFlow de cada switch con cada controlador (solo lectura)
  hosts: switches
  become: true
  gather_facts: false
  vars:
    dias: 2
  tasks:
    - name: Reunir los datos del switch
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          echo "## controlador (estado actual)"
          ovs-vsctl --columns=target,is_connected,role,inactivity_probe,max_backoff,connection_mode list controller 2>&1 | tr -s ' ' | head -24
          echo "## fail-mode de {{ bridge }}"; ovs-vsctl get-fail-mode {{ bridge }} 2>&1
          echo "## desconexiones por hora y controlador (ultimos {{ dias }} dias)"
          ( ls -1t /var/log/openvswitch/ovs-vswitchd.log* 2>/dev/null | head -n {{ (dias | int) + 1 }} | xargs -r zcat -f ) 2>/dev/null \
            | grep -E 'rconn\|(ERR|WARN|INFO)\|.*tcp:[0-9.]+:6653: (no response to inactivity probe|connection closed by peer|connection dropped|connection failed|connection reset)' \
            | sed -E 's/^([0-9-]+T[0-9]{2}):[^|]*\|[^|]*\|rconn\|[A-Z]+\|[^:]*tcp:([0-9.]+):6653: (no response to inactivity probe|connection closed by peer|connection dropped|connection failed|connection reset).*/\1 \2 \3/' \
            | sort | uniq -c | tail -n 40
          echo "## ultimas 6 desconexiones (texto original)"
          ( ls -1t /var/log/openvswitch/ovs-vswitchd.log* 2>/dev/null | head -n 2 | xargs -r zcat -f ) 2>/dev/null \
            | grep -E 'rconn\|.*tcp:[0-9.]+:6653: (no response to inactivity probe|connection closed by peer|connection dropped|connection failed|connection reset)' | tail -n 6 | cut -c1-200
      register: datos
      changed_when: false
      failed_when: false

    - name: Mostrar el resultado de este switch
      ansible.builtin.debug:
        msg: "{{ ['=== ' ~ inventory_hostname ~ ' ==='] + datos.stdout_lines }}"
