# VM IDS (R5): Suricata (sensor en el puerto de espejo del Core) + integrador M09 (alertas -> ONOS REST).
# El integrador lee eve-alerts.json del volumen compartido y habla con ONOS por la red de gestion (CONTROLLER_IP:8181).
# Uso: ./up.sh   (lee ../.env, calcula IDS_MAC, levanta todo e instala el espejo en el Core)
x-r5-env: &r5-env
  ONOS_URL: http://${CONTROLLER_IP:?falta CONTROLLER_IP}:8181/onos/v1
  ONOS_USER: ${ONOS_USER:-onos}
  ONOS_PASS: ${ONOS_PASS:-rocks}
  APP_ID: org.campus.r5
  CORE_DEVICE: ${CORE_DEVICE:?falta CORE_DEVICE}
  EVE_PATH: /var/log/suricata/eve-alerts.json
  STATE_PATH: /var/lib/integrador/state.json
  HOME_NET: ${HOME_NET:-10.0.0.0/24}
  LISTA_BLANCA: ${LISTA_BLANCA:-10.0.0.1/32}
  P_R5: ${P_R5:-42000}
  MAX_SEVERITY: ${MAX_SEVERITY:-2}
  BLOCK_SEC: ${BLOCK_SEC:-300}
  MAPPER_URL: ${MAPPER_URL:-}

services:
  suricata:
    image: jasonish/suricata:7.0.8
    container_name: r5-suricata
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    environment:
      IDS_IFACE: ${IDS_IFACE:?falta IDS_IFACE}
      HOME_NET: ${HOME_NET:-10.0.0.0/24}
      SURICATA_ET: ${SURICATA_ET:-0}
    entrypoint: ["/bin/bash", "/opt/r5/entrypoint.sh"]
    volumes:
      - suricata-log:/var/log/suricata
      - suricata-rules:/var/lib/suricata
      - ../../suricata/local.rules:/opt/r5/local.rules:ro
      - ./suricata/entrypoint.sh:/opt/r5/entrypoint.sh:ro
    restart: unless-stopped

  integrador:
    build:
      context: ../../..
      dockerfile: R5/deploy/ids/Containerfile
    image: r5-integrador:local
    container_name: r5-integrador
    environment: *r5-env
    volumes:
      - suricata-log:/var/log/suricata:ro
      - integrador-state:/var/lib/integrador
    depends_on:
      - suricata
    restart: unless-stopped

  # Instalador del espejo selectivo en el Core (una vez; es permanente). Se ejecuta con: docker compose run --rm espejo
  espejo:
    image: r5-integrador:local
    profiles: ["setup"]
    command: ["python3", "/opt/r5/lab/espejo.py"]
    environment:
      <<: *r5-env
      P_ESPEJO: ${P_ESPEJO:-41000}
      PUERTO_UPLINK: ${PUERTO_UPLINK:-3}
      PUERTO_IDS: ${PUERTO_IDS:-1}
      ESPEJO_HOME_NET: ${ESPEJO_HOME_NET:-10.0.0.0/24}
      ESPEJO_RED_EXTERNA: ${ESPEJO_RED_EXTERNA:-10.0.1.0/24}
      IDS_MAC: ${IDS_MAC:-}
    depends_on:
      - integrador

volumes:
  suricata-log:
  suricata-rules:
  integrador-state:
