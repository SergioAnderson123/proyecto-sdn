# =============================================================================
#  INVENTARIO DEL CAMPUS SDN  —  14 VMs (topologia-v4-14vms.drawio)
#  Fuente unica de verdad: que VM es, que IP tiene y que corre encima.
#  Los overlays (r1-802x, r2-mab, r5-ids) se encienden sobre ESTE inventario;
#  no redefinen hosts.  IP marcadas con TODO se fijan al desplegar.
# -----------------------------------------------------------------------------
#  Segmentos:
#    CONTROL (in-band) 192.168.100.0/24  -> OpenFlow/TLS, REST, Raft, LDAP
#    DATOS             10.0.0.0/24       -> trafico de usuarios y servidores
# =============================================================================

# ---------------------------------------------------------------- 1. CONTROL, IDENTIDAD Y MONITOREO
# Cluster ONOS (3 nodos, Raft) con AAA y monitoreo coubicados (limite de 14 VMs)
[ctrl-1]   role=onos+aaa     onos_id=1  ip=TODO  segment=control  services=onos,freeradius,openldap,policy_mapper,dhcp,dns
[ctrl-2]   role=onos+aaa     onos_id=2  ip=TODO  segment=control  services=onos,openldap_replica,radius_replica,policy_mapper
[ctrl-3]   role=onos+mon     onos_id=3  ip=TODO  segment=control  services=onos,grafana,evebox,logs

# ---------------------------------------------------------------- 2. PERIMETRO
[gateway]  role=gateway      ip=TODO  segment=control  services=nat_egress  notes="NAT solo de salida, doble enlace a ambos cores"

# ---------------------------------------------------------------- 3. DISTRIBUCION (CORE)
[core-1]   role=core         ip=TODO  segment=control  services=ovs  notes="LAG/LACP con core-2, SPAN cruzado a IDS"
[core-2]   role=core         ip=TODO  segment=control  services=ovs  notes="LAG/LACP con core-1, SPAN cruzado a IDS"

# ---------------------------------------------------------------- 4. ACCESO
[acc-1]    role=access       ip=TODO  segment=control  services=ovs  uplink=core-1
[acc-2]    role=access       ip=TODO  segment=control  services=ovs  uplink=core-2

# ---------------------------------------------------------------- 5. SERVIDORES
[srv]      role=servers      ip=10.0.0.40  segment=datos  services=portal,biblioteca  notes="Portal / Biblioteca Virtual"
[srv-dvwa] role=servers      ip=10.0.0.50  segment=datos  services=dvwa,notas,mqtt  notes="DVWA + Notas + MQTT (1883)"

# ---------------------------------------------------------------- 6. SEGURIDAD (IDS redundantes, SPAN solo en cores)
[sec-1]    role=ids          ip=TODO  segment=control  services=suricata,integrador
[sec-2]    role=ids          ip=TODO  segment=control  services=suricata,integrador

# ---------------------------------------------------------------- 7. HOSTS / USUARIOS
[host-prof] role=host        ip=TODO  segment=datos  services=netns_admin  notes="h1-profesor + netns administrador (atacante interno)"
[host-alum] role=host        ip=TODO  segment=datos  services=netns_invitado,netns_iot,portal_cautivo  notes="h2-alumno; portal cautivo 10.0.0.60"

# ---------------------------------------------------------------- 8. ATACANTE (banco de pruebas R5)
[attacker]  role=attacker     ip=TODO  segment=datos  services=nmap,hping3,sqlmap,c2,flood  notes="Llega por el gateway; NO alcanza el segmento de control"